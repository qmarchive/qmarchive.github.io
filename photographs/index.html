<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photographs — QM Archive</title>
<style>
:root{--bg:#090909;--fg:#d8d8d8;--muted:#777;--line:#292929}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font-family:"Courier New",Courier,monospace;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1050px;margin:0 auto;padding:28px 24px 70px}
.chrome{border:1px solid #303030;margin-bottom:28px;background:#0c0c0c}
.chrome-top{height:25px;display:flex;align-items:center;gap:6px;padding:0 9px;border-bottom:1px solid #252525;color:#777;font-size:11px}
.dot{width:7px;height:7px;border:1px solid #555;border-radius:50%}
.address{margin:7px 9px;padding:4px 7px;border:1px solid #252525;color:#777;font-size:11px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:4px 0 22px;border-bottom:1px solid var(--line)}
.kicker{color:#666;font-size:11px;letter-spacing:.08em}
h1{margin:4px 0 0;font-size:24px;font-weight:400;letter-spacing:-.04em}
.back{color:#888;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding-top:28px}
.card{border-bottom:1px solid var(--line);padding-bottom:22px}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(12%);border:1px solid #222}
.meta{padding-top:11px;color:#666;font-size:11px}
.title{margin-top:4px;font-size:15px;color:#c9c9c9}
.footer{margin-top:45px;padding-top:14px;border-top:1px solid var(--line);color:#555;font-size:11px}
@media(max-width:650px){.wrap{padding:18px 16px 55px}.header{align-items:flex-start;flex-direction:column;gap:8px}h1{font-size:21px}.grid{grid-template-columns:1fr;gap:28px}}
</style>
</head>
<body>
<div class="wrap">
<div class="chrome">
<div class="chrome-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>QM ARCHIVE / PHOTOGRAPHS</span></div>
<div class="address">http://qmarchive.github.io/photographs/</div>
</div>
<header class="header">
<div><div class="kicker">QM ARCHIVE / PHOTOGRAPHS</div><h1>Photographs</h1></div>
<a class="back" href="../">← back to archive</a>
</header>
<main id="photos" class="grid"></main>
<div class="footer">images, places, fragments.</div>
</div>
<script>
const photosEl = document.getElementById("photos");
fetch("./content.json?v=1")
.then(r => r.json())
.then(data => {
  photosEl.innerHTML = data.photos.map(photo => `
    <article class="card">
      <a href="./photo-${photo.slug}.html">
        <img src="${photo.image}" alt="${photo.title}" loading="lazy">
      </a>
      <div class="meta">${photo.date}</div>
      <div class="title"><a href="./photo-${photo.slug}.html">${photo.title}</a></div>
    </article>
  `).join("");
})
.catch(() => photosEl.innerHTML = '<p style="color:#777">Unable to load photographs.</p>');
</script>
</body>
</html>
