<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Writings — QUỐC MẠNH</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f1f0ec;
  color: #171717;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  line-height: 1.7;
}

/* =========================
   PAGE
========================= */

.page {
  width: min(1100px, calc(100% - 32px));
  margin: 24px auto 60px;
}

/* =========================
   FAKE BROWSER BAR
========================= */

.browser {
  border: 1px solid #999;
  background: #ddd;
  height: 27px;

  display: flex;
  align-items: center;

  padding: 0 7px;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;

  color: #333;
}

.browser-buttons {
  display: flex;
  gap: 4px;
  margin-right: 8px;
}

.browser-buttons span {
  width: 9px;
  height: 9px;
  border: 1px solid #777;
  background: #eee;
}

.browser-address {
  flex: 1;
  border: 1px solid #aaa;
  background: #f5f5f5;
  height: 17px;
  line-height: 15px;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
}

/* =========================
   HEADER
========================= */

.header {
  padding: 38px 0 18px;
  border-bottom: 1px solid #777;
}

.brand {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 0.08em;
}

.nav {
  margin-top: 14px;

  display: flex;
  gap: 20px;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
}

.nav a {
  color: #222;
  text-decoration: none;
}

.nav a:hover {
  text-decoration: underline;
}

/* =========================
   ARCHIVE
========================= */

.archive {
  padding-top: 42px;
}

.archive-title {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;

  margin-bottom: 25px;
}

.entry {
  display: grid;
  grid-template-columns: 80px 1fr;

  gap: 18px;

  padding: 15px 0;

  border-top: 1px solid #c7c6c1;
}

.entry:last-child {
  border-bottom: 1px solid #c7c6c1;
}

.date {
  color: #777;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;

  padding-top: 4px;
}

.entry-content a {
  color: #171717;
  text-decoration: none;
}

.entry-content a:hover {
  text-decoration: underline;
}

.entry-title {
  font-size: 20px;
  line-height: 1.3;
}

.entry-excerpt {
  margin-top: 7px;

  color: #777;

  font-size: 13px;
  line-height: 1.6;
}

/* =========================
   ARTICLE
========================= */

.article {
  max-width: 760px;

  padding-top: 55px;
}

.article-meta {
  color: #777;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;

  margin-bottom: 13px;
}

.article-title {
  margin: 0 0 34px;

  font-size: 37px;
  font-weight: normal;
  line-height: 1.2;
}

.article-body {
  font-size: 17px;
  line-height: 1.9;
}

.article-body p {
  margin: 0 0 28px;
}

.article-body h2 {
  font-size: 24px;
  font-weight: normal;
  margin: 42px 0 15px;
}

.article-body h3 {
  font-size: 19px;
  font-weight: normal;
  margin: 34px 0 12px;
}

.article-body blockquote {
  margin: 30px 0;
  padding-left: 22px;
  border-left: 2px solid #999;
  color: #555;
}

.article-body img {
  max-width: 100%;
  height: auto;
}

.article-body a {
  color: #222;
}

/* =========================
   BACK
========================= */

.back {
  margin-top: 55px;
  padding-top: 15px;

  border-top: 1px solid #aaa;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
}

.back a {
  color: #333;
  text-decoration: none;
}

.back a:hover {
  text-decoration: underline;
}

/* =========================
   FOOTER
========================= */

.footer {
  margin-top: 70px;

  padding-top: 15px;

  border-top: 1px solid #999;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 10px;

  color: #777;
}

/* =========================
   ERROR
========================= */

.error {
  padding: 60px 0;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;

  color: #555;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .page {
    width: calc(100% - 22px);
    margin-top: 12px;
  }

  .header {
    padding-top: 28px;
  }

  .brand {
    font-size: 22px;
  }

  .nav {
    gap: 14px;
    flex-wrap: wrap;
  }

  .entry {
    grid-template-columns: 1fr;
    gap: 3px;
  }

  .entry-title {
    font-size: 18px;
  }

  .article {
    padding-top: 38px;
  }

  .article-title {
    font-size: 30px;
  }

  .article-body {
    font-size: 16px;
    line-height: 1.8;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- =========================
       BROWSER
  ========================== -->

  <div class="browser">

    <div class="browser-buttons">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="browser-address" id="browserAddress">
      https://qmarchive.github.io/writings/
    </div>

  </div>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="brand">
      QUỐC MẠNH
    </div>

    <nav class="nav">

      <a href="/">
        home
      </a>

      <a href="/writings/">
        writings
      </a>

      <a href="/notes/">
        notes
      </a>

      <a href="/photographs/">
        photographs
      </a>

    </nav>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main id="main">
  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">
    © QUỐC MẠNH
  </footer>

</div>


<script>

/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   SIMPLE MARKDOWN PARSER
========================================================= */

function markdownToHTML(markdown) {

  let text = String(markdown || "")
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n");

  /*
   * Escape HTML first.
   * This keeps the Markdown files safe and predictable.
   */

  text = escapeHTML(text);


  /*
   * Images
   */

  text = text.replace(
    /!\[([^\]]*)\]\(([^)]+)\)/g,
    '<img src="$2" alt="$1">'
  );


  /*
   * Links
   */

  text = text.replace(
    /\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2">$1</a>'
  );


  /*
   * Headings
   */

  text = text.replace(
    /^### (.+)$/gm,
    "<h3>$1</h3>"
  );

  text = text.replace(
    /^## (.+)$/gm,
    "<h2>$1</h2>"
  );


  /*
   * Bold
   */

  text = text.replace(
    /\*\*(.+?)\*\*/g,
    "<strong>$1</strong>"
  );


  /*
   * Italic
   */

  text = text.replace(
    /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
    "<em>$1</em>"
  );


  /*
   * Blockquote
   */

  text = text.replace(
    /^&gt; (.+)$/gm,
    "<blockquote>$1</blockquote>"
  );


  /*
   * Paragraphs
   *
   * Empty lines separate paragraphs.
   */

  const blocks = text
    .split(/\n{2,}/)
    .map(block => block.trim())
    .filter(Boolean);

  return blocks.map(block => {

    if (
      block.startsWith("<h2>") ||
      block.startsWith("<h3>") ||
      block.startsWith("<blockquote>") ||
      block.startsWith("<img")
    ) {
      return block;
    }

    return `<p>${block.replace(/\n/g, "<br>")}</p>`;

  }).join("\n");

}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadJSON(path) {

  const response = await fetch(path);

  if (!response.ok) {
    throw new Error("Cannot load " + path);
  }

  return await response.json();

}


/* =========================================================
   LOAD MARKDOWN
========================================================= */

async function loadMarkdown(path) {

  const response = await fetch(path);

  if (!response.ok) {
    throw new Error("Cannot load " + path);
  }

  return await response.text();

}


/* =========================================================
   ARCHIVE
========================================================= */

function renderArchive(data) {

  const writings = Array.isArray(data.writings)
    ? data.writings
    : [];

  if (!writings.length) {

    document.getElementById("main").innerHTML = `
      <div class="error">
        No writings yet.
      </div>
    `;

    return;
  }


  const entries = writings.map(item => {

    const slug = String(item.slug || "");

    return `
      <article class="entry">

        <div class="date">
          ${escapeHTML(item.date)}
        </div>

        <div class="entry-content">

          <a href="/writings/?slug=${encodeURIComponent(slug)}">

            <div class="entry-title">
              ${escapeHTML(item.title)}
            </div>

            ${
              item.excerpt
              ? `
                <div class="entry-excerpt">
                  ${escapeHTML(item.excerpt)}
                </div>
              `
              : ""
            }

          </a>

        </div>

      </article>
    `;

  }).join("");


  document.getElementById("main").innerHTML = `

    <section class="archive">

      <div class="archive-title">
        Writings
      </div>

      ${entries}

    </section>

  `;


  document.title = "Writings — QUỐC MẠNH";

  document.getElementById("browserAddress").textContent =
    "https://qmarchive.github.io/writings/";

}


/* =========================================================
   ARTICLE
========================================================= */

async function renderArticle(article) {

  const slug = String(article.slug || "");

  const markdownPath =
    "./posts/" + encodeURIComponent(slug) + ".md";


  try {

    const markdown = await loadMarkdown(markdownPath);

    const articleHTML = markdownToHTML(markdown);


    document.getElementById("main").innerHTML = `

      <article class="article">

        <div class="article-meta">
          ${escapeHTML(article.date)}
        </div>

        <h1 class="article-title">
          ${escapeHTML(article.title)}
        </h1>

        <div class="article-body">
          ${articleHTML}
        </div>

        <div class="back">
          <a href="/writings/">
            ← all writings
          </a>
        </div>

      </article>

    `;


    document.title =
      `${article.title} — QUỐC MẠNH`;


    document.getElementById("browserAddress").textContent =
      `https://qmarchive.github.io/writings/?slug=${slug}`;


  } catch (error) {

    console.error(error);

    document.getElementById("main").innerHTML = `

      <div class="error">

        <p>
          This writing could not be found.
        </p>

        <p>
          <a href="/writings/">
            ← back to writings
          </a>
        </p>

      </div>

    `;

  }

}


/* =========================================================
   INIT
========================================================= */

async function init() {

  const main = document.getElementById("main");

  try {

    const data = await loadJSON("./content.json");

    const params =
      new URLSearchParams(window.location.search);

    const slug =
      params.get("slug");


    /*
     * No slug
     * → archive
     */

    if (!slug) {

      renderArchive(data);

      return;
    }


    /*
     * Has slug
     * → article
     */

    const writings = Array.isArray(data.writings)
      ? data.writings
      : [];


    const article =
      writings.find(
        item => String(item.slug) === slug
      );


    if (!article) {

      main.innerHTML = `

        <div class="error">

          <p>
            This writing could not be found.
          </p>

          <p>
            <a href="/writings/">
              ← back to writings
            </a>
          </p>

        </div>

      `;

      return;
    }


    await renderArticle(article);

  } catch (error) {

    console.error(error);

    main.innerHTML = `

      <div class="error">

        <p>
          Unable to load the writings archive.
        </p>

      </div>

    `;

  }

}


init();

</script>

</body>
</html>
