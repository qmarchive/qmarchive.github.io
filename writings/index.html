<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Writings — QUỐC MẠNH</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

html{
  background:#d8cfb5;
}

body{
  min-height:100vh;

  background:
    linear-gradient(
      rgba(255,255,255,.08),
      rgba(255,255,255,.08)
    ),
    #d8cfb5;

  color:#15172f;

  font-family:
    "Courier New",
    Courier,
    monospace;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{

  --cream:#d8cfb5;
  --paper:#e7ddc0;

  --orange:#f05a32;
  --orange-dark:#c84327;

  --teal:#176f78;
  --teal-dark:#0d5059;

  --blue:#15172f;
  --blue-soft:#243b73;

  --green:#1d8a4a;

  --white:#f5ecd7;

  --border:3px solid var(--blue);

}


/* =========================================================
   SCANLINES
========================================================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:99999;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(21,23,47,.035) 0px,
      rgba(21,23,47,.035) 1px,
      transparent 1px,
      transparent 4px
    );

  opacity:.45;

}


/* =========================================================
   PAGE
========================================================= */

.page{

  width:100%;

  min-height:100vh;

  padding:
    10px
    14px
    150px;

}


/* =========================================================
   GENERIC WINDOW
========================================================= */

.window{

  background:var(--paper);

  border:var(--border);

  box-shadow:
    5px 5px 0 var(--blue);

  overflow:hidden;

}


.window-titlebar{

  min-height:38px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    5px 7px;

  background:var(--orange);

  border-bottom:var(--border);

  color:var(--blue);

  font-weight:bold;

  letter-spacing:.8px;

  font-size:14px;

}


.window--teal .window-titlebar{

  background:var(--teal);

  color:var(--white);

}


.window-title{

  display:flex;

  align-items:center;

  gap:8px;

  min-width:0;

}


.window-title-icon{

  width:21px;

  height:21px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  border:2px solid currentColor;

  background:var(--paper);

  color:var(--blue);

  font-size:10px;

  font-weight:bold;

}


.window--teal
.window-title-icon{

  color:var(--blue);

}


.window-buttons{

  display:flex;

  gap:4px;

  flex-shrink:0;

}


.window-button{

  width:20px;

  height:20px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:2px solid var(--blue);

  background:var(--paper);

  color:var(--blue);

  font-size:11px;

  line-height:1;

}


/* =========================================================
   LINKS
========================================================= */

a[href]:hover{

  font-weight:bold;

}


/* =========================================================
   BROWSER
========================================================= */

.browser{

  border:var(--border);

  background:var(--paper);

  box-shadow:
    5px 5px 0 var(--blue);

  margin-bottom:14px;

}


.browser-top{

  min-height:39px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    5px 8px;

  background:var(--orange);

  border-bottom:var(--border);

}


.browser-brand{

  display:flex;

  align-items:center;

  gap:8px;

  color:var(--blue);

  font-weight:bold;

  font-size:17px;

  letter-spacing:1px;

}


.browser-brand-icon{

  width:24px;

  height:24px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:2px solid var(--blue);

  background:var(--teal);

  color:var(--white);

  font-size:12px;

}


.browser-subtitle{

  font-size:11px;

  font-weight:bold;

}


.browser-window-buttons{

  display:flex;

  gap:4px;

}


.browser-window-buttons span{

  width:23px;

  height:23px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:2px solid var(--blue);

  background:var(--paper);

  color:var(--blue);

  font-size:11px;

}


.browser-menu{

  display:flex;

  gap:20px;

  padding:
    6px 10px;

  border-bottom:2px solid var(--blue);

  font-size:12px;

  font-weight:bold;

}


.browser-address-row{

  display:grid;

  grid-template-columns:
    31px
    31px
    31px
    minmax(0,1fr)
    175px;

  gap:6px;

  align-items:center;

  padding:7px;

}


.browser-control{

  width:31px;

  height:27px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:2px solid var(--blue);

  background:var(--paper);

  font-weight:bold;

}


.browser-address{

  min-width:0;

  height:27px;

  display:flex;

  align-items:center;

  padding:
    0 9px;

  border:2px solid var(--blue);

  background:#eee5ce;

  color:#303249;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:11px;

}


.browser-date{

  text-align:center;

  font-size:10px;

  line-height:1.35;

  font-weight:bold;

}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.layout{

  display:grid;

  grid-template-columns:
    285px
    minmax(0,1fr);

  gap:16px;

  max-width:1600px;

  margin:0 auto;

  align-items:start;

}


/* =========================================================
   LEFT / SYSTEM INFO
========================================================= */

.left{

  min-width:0;

}


.system-window{

  overflow:hidden;

}


.system-content{

  padding:13px;

}


.system-line{

  margin:
    7px 0;

  font-size:12px;

}


.online{

  color:#168a43;

  font-weight:bold;

}


/* =========================================================
   NAVIGATION
========================================================= */

.nav-list{

  margin-top:14px;

  padding-top:10px;

  border-top:
    2px dashed var(--blue);

}


.nav-list a{

  display:flex;

  align-items:center;

  gap:10px;

  min-height:36px;

  padding:
    6px 8px;

  color:var(--blue);

  text-decoration:none;

  font-size:14px;

  font-weight:bold;

}


.nav-list a:hover{

  background:var(--orange);

}


.nav-list a.active{

  background:var(--orange);

  color:var(--blue);

}


/* =========================================================
   CSS FOLDER ICON
========================================================= */

.folder-icon{

  width:21px;

  height:15px;

  display:inline-block;

  position:relative;

  flex-shrink:0;

  background:#e8b82e;

  border:2px solid var(--blue);

}


.folder-icon::before{

  content:"";

  position:absolute;

  left:1px;

  top:-6px;

  width:9px;

  height:6px;

  background:#e8b82e;

  border:
    2px solid var(--blue);

  border-bottom:0;

}


/* =========================================================
   CASSETTE
========================================================= */

.cassette{

  margin-top:14px;

  padding:8px;

}


.cassette img{

  display:block;

  width:100%;

  height:auto;

  border:3px solid var(--blue);

}


.cassette img[src$=".gif"]{

  image-rendering:auto;

}


.cassette-caption{

  margin-top:8px;

  text-align:center;

  font-size:10px;

  line-height:1.5;

  font-weight:bold;

}


/* =========================================================
   CENTER
========================================================= */

.center{

  min-width:0;

  display:flex;

  flex-direction:column;

  gap:16px;

}


/* =========================================================
   WRITINGS WINDOW
========================================================= */

.writings-window{

  min-width:0;

  overflow:hidden;

}


/* =========================================================
   WRITINGS INTRO
========================================================= */

.writing-intro{

  padding:
    12px 16px;

  border-bottom:
    2px dashed var(--blue);

  background:#eee5ce;

  color:var(--blue);

  font-size:12px;

  line-height:1.6;

}


/* =========================================================
   SEARCH
========================================================= */

.writing-search{

  display:flex;

  align-items:center;

  gap:8px;

  padding:
    10px 12px;

  border-bottom:
    var(--border);

  background:var(--cream);

}


.search-icon{

  width:31px;

  height:31px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  border:
    2px solid var(--blue);

  background:var(--paper);

  color:var(--blue);

  font-size:17px;

  line-height:1;

}


.search-input{

  min-width:0;

  flex:1;

  height:31px;

  padding:
    0 9px;

  border:
    2px solid var(--blue);

  outline:none;

  background:#eee5ce;

  color:var(--blue);

  font-family:inherit;

  font-size:11px;

}


.search-input::placeholder{

  color:#656579;

}


.search-input:focus{

  background:#f5ecd7;

}


.search-clear{

  width:31px;

  height:31px;

  display:none;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  border:
    2px solid var(--blue);

  background:var(--paper);

  color:var(--blue);

  font-family:inherit;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;

}


.search-clear:hover{

  color:var(--white);

  background:var(--teal);

}


/* =========================================================
   WRITING ARCHIVE
========================================================= */

.archive{

  width:100%;

}


.archive-entry{

  display:grid;

  grid-template-columns:
    105px
    minmax(0,1fr)
    28px;

  gap:10px;

  align-items:center;

  padding:
    12px 14px;

  border-bottom:
    1px solid #777786;

  background:var(--paper);

  color:var(--blue);

  text-decoration:none;

}


.archive-entry:last-child{

  border-bottom:0;

}


.archive-entry:hover{

  background:#f5ecd7;

}


.archive-date{

  color:var(--teal);

  font-size:10px;

  font-weight:bold;

}


.archive-content{

  min-width:0;

}


.archive-title{

  color:var(--blue);

  font-size:12px;

  line-height:1.4;

  font-weight:bold;

}


.archive-entry:hover
.archive-title{

  color:var(--orange);

}


.archive-excerpt{

  margin-top:4px;

  color:#5f6070;

  font-size:10px;

  line-height:1.5;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

}


.archive-arrow{

  text-align:right;

  color:var(--blue);

  font-size:16px;

  font-weight:bold;

}


/* =========================================================
   SEARCH EMPTY STATE
========================================================= */

.search-empty{

  padding:
    35px 20px;

  background:#eee5ce;

  color:#5f6070;

  font-size:11px;

  line-height:1.8;

  text-align:center;

}


/* =========================================================
   ARTICLE / DETAIL
========================================================= */

.article{

  padding:
    20px
    22px
    30px;

}


.article-year{

  color:var(--teal);

  font-size:11px;

  font-weight:bold;

  margin-bottom:8px;

}


.article-title{

  color:var(--blue);

  font-size:28px;

  font-weight:bold;

  line-height:1.25;

  margin:
    0 0 28px;

}


/* =========================================================
   ARTICLE BODY
========================================================= */

.article-body{

  max-width:1000px;

  color:var(--blue);

  font-size:14px;

  line-height:1.9;

  letter-spacing:.05px;

}


.article-body p{

  margin:
    0 0 24px;

}


.article-body h1,
.article-body h2,
.article-body h3{

  color:var(--blue);

  font-weight:bold;

}


.article-body h1{

  font-size:25px;

  margin:
    30px 0 20px;

}


.article-body h2{

  font-size:20px;

  margin:
    30px 0 18px;

}


.article-body h3{

  font-size:17px;

  margin:
    25px 0 13px;

}


.article-body em{

  color:var(--teal);

}


.article-body strong{

  color:var(--orange);

}


.article-body blockquote{

  margin:
    25px 0;

  padding:
    12px 15px;

  border-left:
    5px solid var(--orange);

  background:var(--white);

  color:var(--teal);

}


.article-body ul,
.article-body ol{

  margin:
    0 0 24px;

  padding-left:25px;

}


.article-body li{

  margin-bottom:7px;

}


.article-body a{

  color:var(--teal);

  font-weight:bold;

}


.article-body img{

  display:block;

  width:auto;

  max-width:100%;

  height:auto;

  margin:
    30px 0;

  border:
    3px solid var(--blue);

}


/* =========================================================
   ARTICLE BACK
========================================================= */

.article-back{

  display:inline-block;

  margin-top:20px;

  padding:
    6px 10px;

  border:
    2px solid var(--blue);

  background:var(--paper);

  color:var(--blue);

  text-decoration:none;

  font-size:11px;

  font-weight:bold;

}


.article-back:hover{

  color:var(--white);

  background:var(--teal);

}


/* =========================================================
   ERROR
========================================================= */

.error{

  padding:
    35px 20px;

  background:#eee5ce;

  color:#8b2c1e;

  font-size:11px;

  line-height:1.8;

}


.error strong{

  font-weight:bold;

}


/* =========================================================
   FOOTER QUOTE
========================================================= */

.footer{

  width:
    min(940px, calc(100% - 28px));

  margin:
    16px auto 0;

  padding:
    10px 14px;

  border:
    3px solid var(--blue);

  background:var(--paper);

  color:var(--teal);

  text-align:center;

  font-size:10px;

  font-weight:bold;

}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.music-player{

  position:fixed;

  width:
    min(940px, calc(100% - 28px));

  left:50%;

  right:auto;

  bottom:10px;

  transform:translateX(-50%);

  z-index:10000;

  display:grid;

  grid-template-columns:
    auto
    minmax(150px,1fr)
    auto
    minmax(150px,1.5fr)
    auto
    auto;

  gap:9px;

  align-items:center;

  padding:
    6px 8px;

  background:var(--paper);

  border:
    3px solid var(--blue);

  box-shadow:
    5px 5px 0 var(--blue);

}


.music-icon{

  width:35px;

  height:35px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--orange);

  border:
    3px solid var(--blue);

  font-weight:bold;

}


.music-info{

  min-width:0;

}


.music-label{

  font-size:8px;

  margin-bottom:2px;

}


.music-title{

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:11px;

  font-weight:bold;

}


.music-controls{

  display:flex;

  gap:4px;

}


.music-button{

  width:33px;

  height:29px;

  border:
    3px solid var(--blue);

  background:#eee5ce;

  color:var(--blue);

  font-family:inherit;

  font-weight:bold;

  cursor:pointer;

}


.music-button:hover{

  background:var(--orange);

}


.music-progress{

  min-width:0;

}


.music-progress input{

  width:100%;

  accent-color:var(--orange);

}


.music-time{

  min-width:72px;

  text-align:center;

  font-size:9px;

}


.music-volume{

  width:100px;

}


.music-volume input{

  width:100%;

  accent-color:var(--teal);

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1200px){

  .layout{

    grid-template-columns:
      220px
      minmax(0,1fr);

  }


  .archive-entry{

    grid-template-columns:
      90px
      minmax(0,1fr)
      24px;

  }


  .music-player{

    grid-template-columns:
      auto
      minmax(120px,1fr)
      auto
      minmax(120px,1fr)
      auto;

  }


  .music-volume{

    display:none;

  }

}


/* =========================================================
   MOBILE / SMALL TABLET
========================================================= */

@media(max-width:850px){

  .page{

    padding:
      7px
      7px
      125px;

  }


  .browser-menu{

    display:none;

  }


  .browser-address-row{

    grid-template-columns:
      31px
      minmax(0,1fr)
      31px;

  }


  .browser-address-row
  .browser-control:nth-child(2){

    display:none;

  }


  .browser-date{

    display:none;

  }


  .layout{

    display:block;

  }


  .left{

    margin-bottom:16px;

  }


  .nav-list{

    display:grid;

    grid-template-columns:
      repeat(2,1fr);

  }


  .archive-entry{

    grid-template-columns:
      82px
      minmax
