<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hôm nay trời Hà Nội đẹp một cách đáng ngờ. — QM Archive</title>
<style>
:root{
  --bg:#090909;
  --fg:#d8d8d8;
  --muted:#858585;
  --line:#292929;
  --accent:#eeeeee;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font-family:"Courier New",Courier,monospace;
  font-size:14px;
  line-height:1.65;
}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1050px;margin:0 auto;padding:28px 24px 70px}
.chrome{
  border:1px solid #303030;
  margin-bottom:28px;
  background:#0c0c0c;
}
.chrome-top{
  height:25px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 9px;
  border-bottom:1px solid #252525;
  color:#777;
  font-size:11px;
}
.dot{width:7px;height:7px;border:1px solid #555;border-radius:50%}
.address{
  margin:7px 9px;
  padding:4px 7px;
  border:1px solid #252525;
  color:#777;
  font-size:11px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  padding:4px 0 22px;
  border-bottom:1px solid var(--line);
}
.kicker{color:#666;font-size:11px;letter-spacing:.08em}
h1{
  margin:4px 0 0;
  font-size:24px;
  font-weight:400;
  letter-spacing:-.04em;
}
.back{color:#888;font-size:12px}
.note{
  padding:25px 0 29px;
  border-bottom:1px solid var(--line);
  max-width:760px;
}
.note:last-child{border-bottom:0}
.date{color:#666;font-size:11px;margin-bottom:8px}
.note h2{
  margin:0 0 12px;
  font-size:18px;
  font-weight:400;
  line-height:1.4;
}
.note p{margin:0;color:#bdbdbd}
.footer{
  margin-top:45px;
  padding-top:14px;
  border-top:1px solid var(--line);
  color:#555;
  font-size:11px;
}
@media(max-width:650px){
  .wrap{padding:18px 16px 55px}
  .header{align-items:flex-start;flex-direction:column;gap:8px}
  h1{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="chrome">
    <div class="chrome-top">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span>QM ARCHIVE / NOTE</span>
    </div>
    <div class="address">http://qmarchive.github.io/notes/</div>
  </div>

  <header class="header">
    <div>
      <div class="kicker">QM ARCHIVE / NOTE</div>
      <h1>Note</h1>
    </div>
    <a class="back" href="./">← all notes</a>
  </header>

  <main class="note">
    <div class="date">21.09.2026</div>
    <h2>Hôm nay trời Hà Nội đẹp một cách đáng ngờ.</h2>
    <p>Hôm nay trời Hà Nội đẹp một cách đáng ngờ.</p>
  </main>

  <div class="footer">QM Archive</div>
</div>
</body>
</html>
